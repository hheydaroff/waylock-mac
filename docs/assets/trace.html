<!DOCTYPE html>
<!--
  Source for docs/assets/trace.png — the README's hero image (880x250).

  A claim like "the window is measured, not guessed" is worth nothing as a
  sentence and everything as the picture that made the decision: hundreds of real
  gaps, the tail that reaches past 10 s, and the line the app draws.
  Regenerate with scripts/render-social-preview.sh.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 880px; height: 236px; }
  body {
    background: #0b0d0f; color: #e8e6e1;
    font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    padding: 20px 24px 0;
  }
  .head { display: flex; justify-content: space-between; align-items: baseline; }
  .title { font-size: 13px; letter-spacing: .01em; }
  .note { font-size: 11px; color: #6b737c; }
  svg { display: block; margin-top: 10px; }
  .axis text { font: 10px ui-monospace, Menlo, monospace; fill: #6b737c; }
  .grid line { stroke: #1b2126; }
  .caption { font-size: 11px; color: #6b737c; margin-top: 12px; }
  .caption b { color: #9aa3ad; font-weight: 500; }
</style>
</head>
<body>
  <div class="head">
    <div class="title">union gaps between packets — 10 min at the desk</div>
    <div class="note" id="note"></div>
  </div>
  <svg id="chart" width="832" height="164" viewBox="0 0 832 164"></svg>
  <div class="caption">
    one mark is one gap between two packets · <b>nothing past the line</b> in ten minutes
    at the desk, which is why the line sits there
  </div>

<script>

const WINDOW = 15;          // the shipped default
const X0 = 8, X1 = 812, W = X1 - X0;
const LO = Math.log(0.05), HI = Math.log(60);
const xOf = v => X0 + ((Math.log(Math.max(v, 0.05)) - LO) / (HI - LO)) * W;

const sorted = [...GAPS].sort((a, b) => a - b);
document.getElementById('note').textContent =
  `${sorted.length} gaps · median ${sorted[Math.floor(sorted.length / 2)].toFixed(1)} s`
  + ` · worst ${sorted[sorted.length - 1].toFixed(1)} s`;

const rows = 6, rowH = 19, yTop = 16;   // `top` would collide with window.top
let out = '';

// shade the zone that means "away", not the zone that means "present"
out += `<rect x="${xOf(WINDOW)}" y="0" width="${X1 - xOf(WINDOW)}" height="${yTop + rows * rowH}"`
     + ` fill="rgba(240,180,41,.05)"/>`;

const marks = [0.5, 1, 2, 5, 10, 20, 60];
out += '<g class="grid">' + marks.map(m =>
  `<line x1="${xOf(m)}" y1="0" x2="${xOf(m)}" y2="${yTop + rows * rowH}"/>`).join('') + '</g>';
out += '<g class="axis">' + marks.map(m =>
  `<text x="${xOf(m)}" y="${yTop + rows * rowH + 15}" text-anchor="${m === marks[marks.length - 1] ? 'end' : 'middle'}">${m + 's'}</text>`).join('')
  ;

GAPS.forEach((g, i) => {
  const col = i % rows, y = yTop + col * rowH + ((i * 41) % 7);
  out += `<circle cx="${xOf(g).toFixed(1)}" cy="${y}" r="2.1" fill="#e8e6e1" opacity=".5"/>`;
});

out += `<line x1="${xOf(WINDOW)}" y1="0" x2="${xOf(WINDOW)}" y2="${yTop + rows * rowH}"`
     + ` stroke="#f0b429" stroke-width="1.4" stroke-dasharray="4 3"/>`;
out += `<text x="${xOf(WINDOW) + 8}" y="12" font-size="11" fill="#f0b429"`
     + ` font-family="ui-monospace, Menlo, monospace">${WINDOW} s window → away</text>`;
document.getElementById('chart').innerHTML = out;
</script>
</body>
</html>
